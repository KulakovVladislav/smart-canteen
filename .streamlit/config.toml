[theme]
base = "light"
primaryColor = "#0f5b4f"
backgroundColor = "#f4f5f3"
secondaryBackgroundColor = "#eceee8"
textColor = "#1b2a26"
linkColor = "#0f5b4f"
borderColor = "#e3e5e1"
baseRadius = "12px"
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
headingFont = "Space Grotesk, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"

[theme.dark]
primaryColor = "#2a9d8f"
backgroundColor = "#111418"
secondaryBackgroundColor = "#1a1e24"
textColor = "#e6e8ec"
linkColor = "#2a9d8f"
borderColor = "#2b313a"
baseRadius = "12px"

[server]
headless = true
address = "0.0.0.0"
